name: Build

# Builds, tests and publishes victory.exe off the developers' machines, in
# parallel jobs. Started by hand only, choosing the jobs that are needed:
#   gh workflow run build.yml --ref <branch> -f build_diag=false -f test_rest=true
# Nothing from the game is ever present here: tests that need the game or a
# hardware GPU skip themselves when they are missing.
run-name: Build ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build victory.exe (release)
        type: boolean
        default: true
      build_diag:
        description: Build victory-diag.exe (diagnostics)
        type: boolean
        default: true
      test_shader:
        description: Tests of victory-shader
        type: boolean
        default: false
      test_rest:
        description: Tests of the rest of the workspace (with the asset policy)
        type: boolean
        default: false
      shader_test_binary:
        description: Build the test program of victory-shader and keep it (to run where a GPU is)
        type: boolean
        default: false
      clippy:
        description: Clippy (non-blocking)
        type: boolean
        default: false
      publish:
        description: Update the rolling prerelease (only on main and integ/**)
        type: boolean
        default: true
      build_probe:
        description: Build the card test binaries (tests/memory_cost.rs) to run on a PC with a card
        type: boolean
        default: false
      bench_audio:
        description: Measure the audio DSP convolution in release (victory-hle, ignored test), in the job summary
        type: boolean
        default: false
      stress_guards:
        description: Stress the guards' no-lost-write test (watch::many_askers_tests::stress_guard_modes), counts in the job summaries
        type: boolean
        default: false
      stress_n:
        description: Runs of each stress case (at most; each case also stops after stress_secs)
        type: string
        default: "500"
      stress_secs:
        description: Seconds after which a stress case stops
        type: string
        default: "1500"
      stress_suite_n:
        description: Runs of the whole victory-gpu lib test suite per runner, counting the tests that failed (0 skips it)
        type: string
        default: "0"
      stress_cases:
        description: JSON list of stress cases
        type: string
        default: '["mixed_r50_1v","mixed_r0_3v","s64_r50_1v","s0_r50_1v"]'
      stress_lean:
        description: JSON list of the cpu5 switch states to stress (0 off, 1 on; only branches with cpu5 have 1)
        type: string
        default: '["0"]'
      bench_land:
        description: Measure the landing merge's kernels in release (victory-gpu, ignored test), in the job summary
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # The repo's cache budget is 10 GB: only main and integ/** save caches, the
  # other branches restore them without evicting.
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/integ/') }}

defaults:
  run:
    shell: bash

jobs:
  build-release:
    if: ${{ inputs.build_release }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version, targets and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - run: cargo build --release --locked -p victory
      - name: Collect
        run: |
          mkdir -p dist
          cp target/release/victory.exe dist/victory.exe
          cp Play-VIctory.cmd dist/Play-VIctory.cmd
          # dxil.dll (for --validate and --pipelines) from the runner's Windows SDK.
          dxil="$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/dxil.dll 2>/dev/null | sort | tail -n 1)"
          if [ -n "$dxil" ]; then cp "$dxil" dist/dxil.dll; else echo "::warning::no dxil.dll on the runner"; fi
      - uses: actions/upload-artifact@v5
        with:
          name: victory-release
          path: dist/
          retention-days: 14
          if-no-files-found: error

  build-diag:
    if: ${{ inputs.build_diag }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - run: cargo build --profile diag --locked -p victory --features diagnostics
      - name: Collect
        run: |
          mkdir -p dist
          cp target/diag/victory.exe dist/victory-diag.exe
          # The symbols of this exe, to read a VICTORY_PROFILE file (module+rva) taken with it.
          cp target/diag/victory.pdb dist/victory-diag.pdb
          sha256sum dist/victory-diag.exe | tee dist/victory-diag.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: victory-diag
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # The tests that need a real card, built here and run on a PC that has one
  # (`gh run download <id> -n probe-memory-cost`): never run on the runner.
  build-probe:
    if: ${{ inputs.build_probe }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - run: cargo test -p victory-gpu --features diagnostics --test memory_cost --no-run
      - name: Collect
        run: |
          mkdir -p dist
          exe="$(ls -t target/debug/deps/memory_cost-*.exe | head -n 1)"
          cp "$exe" dist/memory_cost.exe
      - uses: actions/upload-artifact@v5
        with:
          name: probe-memory-cost
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # victory-shader's tests run apart with few threads: many tests creating
  # WARP devices at once crash the runner (no hardware GPU there, so the
  # GPU-only tests skip and the rest use WARP).
  test-shader:
    if: ${{ inputs.test_shader }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - name: Tests
        run: |
          set -o pipefail
          cargo test -p victory-shader --locked --no-fail-fast -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: bash .github/scripts/test-summary.sh "victory-shader (4 threads)" "$RUNNER_TEMP/test.log"

  # The test program of victory-shader, built and not run: the tests that need a hardware GPU skip
  # themselves here, and run where there is one (download the artifact and run it in
  # crates/victory-shader, with --test-threads=1).
  shader-test-binary:
    if: ${{ inputs.shader_test_binary }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - name: Build
        run: |
          cargo test -p victory-shader --locked --no-run
          exe=$(ls -t target/debug/deps/victory_shader-*.exe | head -1)
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$exe" "$RUNNER_TEMP/bin/victory_shader_tests.exe"
          echo "built $exe"
      - uses: actions/upload-artifact@v4
        with:
          name: victory-shader-tests
          path: ${{ runner.temp }}/bin/victory_shader_tests.exe
          retention-days: 3

  # Includes xtask's repository_passes_policy (the asset-policy check).
  #
  # Skipped, because the software adapter (WARP) on the runner has no depth
  # bounds test:
  #   pipeline::host::tests::depth_bounds_pipeline_loads_and_filters_draws
  test-rest:
    if: ${{ inputs.test_rest }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - name: Tests
        run: |
          set -o pipefail
          cargo test --workspace --exclude victory-shader --locked --no-fail-fast -- \
            --skip pipeline::host::tests::depth_bounds_pipeline_loads_and_filters_draws \
            2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: bash .github/scripts/test-summary.sh "workspace except victory-shader" "$RUNNER_TEMP/test.log"

  # The guards' no-lost-write stress (watch::many_askers_tests::stress_guard_modes): the test program is built once, and
  # each case of the matrix runs it on a runner of its own; the counts of runs that lost a write are in each job's summary.
  stress-build:
    if: ${{ inputs.stress_guards }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - name: Build
        run: |
          cargo test -p victory-gpu --lib --locked --no-run
          exe=$(ls -t target/debug/deps/victory_gpu-*.exe | head -1)
          mkdir -p dist
          cp "$exe" dist/victory_gpu_tests.exe
          echo "built $exe"
      - uses: actions/upload-artifact@v5
        with:
          name: stress-guards-exe
          path: dist/victory_gpu_tests.exe
          retention-days: 3
          if-no-files-found: error

  stress-run:
    needs: stress-build
    if: ${{ inputs.stress_guards }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(inputs.stress_cases) }}
        lean: ${{ fromJSON(inputs.stress_lean) }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: stress-guards-exe
          path: dist
      - name: Stress
        env:
          VICTORY_STRESS_CASE: ${{ matrix.case }}
          VICTORY_STRESS_LEAN: ${{ matrix.lean }}
          VICTORY_STRESS_N: ${{ inputs.stress_n }}
          VICTORY_STRESS_SECS: ${{ inputs.stress_secs }}
        run: |
          set -o pipefail
          ./dist/victory_gpu_tests.exe --ignored --exact watch::many_askers_tests::stress_guard_modes --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/stress.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Stress ${{ matrix.case }} lean=${{ matrix.lean }} ($GITHUB_REF_NAME $GITHUB_SHA)"
            echo '```'
            grep -h "STRESS-RESULT" "$RUNNER_TEMP/stress.log" || echo "no result line"
            grep -h "STRESS-PANIC" "$RUNNER_TEMP/stress.log" | head -5 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The whole lib test program run again and again, as the CI's test job runs it (all the tests at once, so that the
  # tests that map views meet each other), counting which tests failed: the flake may need the others' company.
  stress-suite:
    needs: stress-build
    if: ${{ inputs.stress_guards && inputs.stress_suite_n != '0' }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        threads: [4, 16]
        runner: [a, b]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: stress-guards-exe
          path: dist
      - name: Suite
        run: |
          exe="$GITHUB_WORKSPACE/dist/victory_gpu_tests.exe"
          cd crates/victory-gpu
          fails=0
          : > "$RUNNER_TEMP/failed.txt"
          started=$SECONDS
          for i in $(seq 1 ${{ inputs.stress_suite_n }}); do
            if [ $((SECONDS - started)) -gt 2400 ]; then echo "stopped by time after $((i - 1)) runs"; break; fi
            runs=$i
            "$exe" --test-threads=${{ matrix.threads }} --skip pipeline::host::tests::depth_bounds_pipeline_loads_and_filters_draws > "$RUNNER_TEMP/suite.log" 2>&1 && continue
            fails=$((fails + 1))
            grep -h '^test .* FAILED' "$RUNNER_TEMP/suite.log" | tee -a "$RUNNER_TEMP/failed.txt"
            grep -h 'is not after' "$RUNNER_TEMP/suite.log" | head -3 | tee -a "$RUNNER_TEMP/failed.txt"
          done
          {
            echo "## Suite threads=${{ matrix.threads }} ($GITHUB_REF_NAME $GITHUB_SHA)"
            echo '```'
            echo "SUITE-RESULT threads=${{ matrix.threads }} runs=${runs:-0} failed_runs=$fails"
            sort "$RUNNER_TEMP/failed.txt" | uniq -c
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The cost of the audio DSP's convolution on the runner's CPU, optimized
  # (the unit tests run unoptimized): milliseconds a block, first version
  # against ours, written to the job summary.
  bench-audio:
    if: ${{ inputs.bench_audio }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - name: Bench
        run: |
          set -o pipefail
          cargo test --release -p victory-hle --lib --locked -- --ignored --nocapture --test-threads=1 convolution_bench 2>&1 | tee "$RUNNER_TEMP/bench.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Audio DSP convolution (release, $(grep -m1 'model name' /proc/cpuinfo 2>/dev/null || echo "runner CPU"))"
            echo '```'
            grep -h "convolution_bench" "$RUNNER_TEMP/bench.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # What landing the card's bytes costs on the runner's CPU, optimized: the merge's kernels (the plain loop and the
  # ones that ask ahead for their bytes) on pieces made like a frame's, cold memory, one thread and three. The
  # equivalence tests of the same kernels run with the rest (test-rest).
  bench-land:
    if: ${{ inputs.bench_land }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - name: Bench
        run: |
          set -o pipefail
          cargo test --release -p victory-gpu --lib --locked -- --ignored --nocapture --test-threads=1 land_merge_bench 2>&1 | tee "$RUNNER_TEMP/bench.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Landing merge kernels (release, $(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" 2>/dev/null || echo "runner CPU"), $(nproc) logical CPUs)"
            echo '```'
            grep -h "land_merge_bench" "$RUNNER_TEMP/bench.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Non-blocking: the fork still has warnings (summary only).
  clippy:
    if: ${{ inputs.clippy }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ env.SAVE_CACHE }}
      - name: Clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked 2>&1 | tee "$RUNNER_TEMP/clippy.log"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Clippy (non-blocking)"
            echo "$(grep -c '^warning' "$RUNNER_TEMP/clippy.log" || true) warning lines, $(grep -c '^error' "$RUNNER_TEMP/clippy.log" || true) error lines"
          } >> "$GITHUB_STEP_SUMMARY"

  # Rolling prerelease per branch (tag build-<branch, / replaced by ->), moved
  # to the commit, assets replaced: a stable public URL for the latest exe,
  # e.g. .../releases/download/build-main/victory.exe
  publish:
    needs: [build-release, build-diag]
    # Runs when at least one build ran and none failed.
    if: ${{ !cancelled() && inputs.publish && (github.ref_name == 'main' || startsWith(github.ref_name, 'integ/')) && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: victory-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ls -l dist
          tag="build-${BRANCH//\//-}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          notes="Rolling build of \`${BRANCH}\` at ${GITHUB_SHA}, from ${run_url}. Files: $(ls dist | xargs). Replaced by the next published run."
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit "$tag" --prerelease --target "${GITHUB_SHA}" --title "Build ${BRANCH}" --notes "$notes"
          else
            gh release create "$tag" --prerelease --target "${GITHUB_SHA}" --title "Build ${BRANCH}" --notes "$notes"
          fi
          gh release upload "$tag" dist/* --clobber
          {
            echo "## Published ${GITHUB_SHA::9}"
            echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"
            echo
            echo "Exe: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/victory.exe"
          } >> "$GITHUB_STEP_SUMMARY"
