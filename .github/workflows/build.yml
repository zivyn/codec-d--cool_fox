name: Build

# Builds, tests and publishes victory.exe off the developers' machines.
# Nothing from the game is ever present here: tests that need the game or a
# hardware GPU skip themselves when they are missing.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    # Only this job writes: the rolling prerelease for main and integ/**.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The version, targets and components pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        id: release
        run: cargo build --release --locked -p victory

      - name: Build diag
        id: diag
        run: cargo build --profile diag --locked -p victory --features diagnostics

      - name: Collect binaries
        id: collect
        run: |
          mkdir -p dist
          cp target/release/victory.exe dist/victory.exe
          cp target/diag/victory.exe dist/victory-diag.exe
          # dxil.dll (for --validate and --pipelines) from the runner's Windows SDK.
          dxil="$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/dxil.dll 2>/dev/null | sort | tail -n 1)"
          if [ -n "$dxil" ]; then cp "$dxil" dist/dxil.dll; else echo "::warning::no dxil.dll on the runner"; fi
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload binaries
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: victory-windows-x64-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # Includes xtask's repository_passes_policy (the asset-policy check).
      # victory-shader's tests run apart with few threads: many tests creating
      # WARP devices at once crash the runner (no hardware GPU there, so the
      # GPU-only tests skip and the rest use WARP).
      - name: Tests (workspace except victory-shader)
        id: test_ws
        if: ${{ !cancelled() }}
        run: |
          mkdir -p logs
          cargo test --workspace --exclude victory-shader --locked 2>&1 | tee logs/test-workspace.log

      - name: Tests (victory-shader, 4 threads)
        id: test_shader
        if: ${{ !cancelled() }}
        run: |
          mkdir -p logs
          cargo test -p victory-shader --locked -- --test-threads=4 2>&1 | tee logs/test-shader.log

      # Non-blocking: the fork still has warnings (summary only).
      - name: Clippy (non-blocking)
        id: clippy
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p logs
          cargo clippy --workspace --all-targets --locked 2>&1 | tee logs/clippy.log

      - name: Job summary
        if: ${{ !cancelled() }}
        env:
          RELEASE: ${{ steps.release.outcome }}
          DIAG: ${{ steps.diag.outcome }}
          T_WS: ${{ steps.test_ws.outcome }}
          T_SHADER: ${{ steps.test_shader.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          count() { # sum a field of the "test result:" lines of a log
            grep -h "^test result:" "$1" 2>/dev/null | sed -E "s/.* ([0-9]+) $2.*/\1/;t;d" | awk '{s+=$1} END {print s+0}'
          }
          row() { # name, outcome, log
            echo "| $1 | $2 | $(count "$3" passed) | $(count "$3" failed) | $(count "$3" ignored) |"
          }
          {
            echo "## Build ${GITHUB_SHA::9} on ${GITHUB_REF_NAME}"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| release build | $RELEASE |"
            echo "| diag build | $DIAG |"
            echo "| clippy (non-blocking) | $CLIPPY, $(grep -c '^warning' logs/clippy.log 2>/dev/null || echo 0) warning lines, $(grep -c '^error' logs/clippy.log 2>/dev/null || echo 0) error lines |"
            echo
            echo "| Tests | Result | Passed | Failed | Ignored |"
            echo "|---|---|---|---|---|"
            row "workspace (no victory-shader)" "$T_WS" logs/test-workspace.log
            row "victory-shader (4 threads)" "$T_SHADER" logs/test-shader.log
            echo
            echo "Binaries: artifact \`victory-windows-x64-${GITHUB_SHA}\` (14 days) on this run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Failed tests:"
            echo '```'
            grep -h -E "^test .* FAILED$|^failures:$|panicked at" logs/test-*.log 2>/dev/null | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ github.sha }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore

      # Rolling prerelease per branch (tag build-<branch, / replaced by ->),
      # moved to the commit, assets replaced: a stable public URL for the
      # latest exe, e.g. .../releases/download/build-main/victory.exe
      - name: Publish rolling prerelease
        if: ${{ !cancelled() && steps.collect.outcome == 'success' && github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'integ/')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TESTS_WS: ${{ steps.test_ws.outcome }}
          TESTS_SHADER: ${{ steps.test_shader.outcome }}
        run: |
          tag="build-${BRANCH//\//-}"
          notes="Rolling build of \`${BRANCH}\` at ${GITHUB_SHA} (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Tests: workspace ${TESTS_WS}, victory-shader ${TESTS_SHADER}. Replaced on every push."
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${tag}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null
            gh release edit "$tag" --prerelease --title "Build ${BRANCH}" --notes "$notes"
          else
            gh release create "$tag" --prerelease --target "${GITHUB_SHA}" --title "Build ${BRANCH}" --notes "$notes"
          fi
          gh release upload "$tag" dist/* --clobber
          echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exe: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/victory.exe" >> "$GITHUB_STEP_SUMMARY"
